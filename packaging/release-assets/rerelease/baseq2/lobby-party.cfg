// ============================================================================
//  lobby-party.cfg
// ----------------------------------------------------------------------------
//  A 16-slot unranked mutator lobby spanning solo, team, objective, round, and
//  Horde variants. Load before creating the lobby:
//
//      exec lobby-party.cfg
//
//  Players change flavour through curated factories, keeping each mutator's
//  gametype, limits, ruleset, and cleanup behavior together.
// ============================================================================

// If you copy this preset, point this exec at your copied baseline and update
// the pool/cycle filenames below to your operator-owned copies.
exec server-base.cfg

// ---- Connected capacity ---------------------------------------------------
set maxclients "16"
kexmultiplayer maxplayers "16"

// ---- Structured map catalog and rotation ---------------------------------
set g_maps_pool_file "muffmode-map-pool.json"
set g_maps_cycle_file "muffmode-map-cycle.txt"
set g_maps_random "1"
set g_maps_repeat_delay "1800"
set g_map_pick "15"

// ---- Match record and intermission policy --------------------------------
set g_ranked "0"
set g_match_awards "0"

// ---- Voting and player map choice -----------------------------------------
// 2056 disables direct gametype (8) and ruleset (2048) votes. This prevents a
// vote from splitting a mutator factory from the base mode it was built for.
set g_allow_voting "1"
set g_allow_vote_midgame "1"
set g_allow_spec_vote "0"
set g_allow_mymap "1"
set g_vote_limit "3"
set g_vote_flags "2056"
set g_votable_gametypes "ffa duel tdm ctf ca ft strike rr lms horde"
set g_votable_factories "ffa_rockets ffa_rockets_air instagib instagib_jump instagib_frenzy nadefest vampffa frenzyffa quadffa instaduel vampduel instatdm vamptdm frenzytdm quadtdm nadetdm instactf vampctf frenzyctf nadectf instaca vampca frenzyca nadeca instaft vampft frenzyft instastrike vampstrike instarr vamprr frenzyrr instalms vamplms vamphorde"
set g_votable_rulesets "q2re mm q3a q2reb q qc"
set g_gametype_locked "0"

// ---- Matching startup selection ------------------------------------------
// Re-executing the complete preset live safely restores the shared baseline
// and re-applies this factory's mutators and settings at a map boundary.
set g_gametype "1"
set g_factory "instagib_jump"
