// --------------------
// MUFFMODE ARENA ROOMS CONFIG
// --------------------
// Tagged multi-room maps are the native path: every validated room runs
// independently and arena 0 is the lobby. Classic RA2 idmaps are supported as
// one shared virtual room through the compatibility profile.


// --------------------
// SERVER IDENTITY
// --------------------
set hostname "MuffMode Arena"
set g_gametype_cfg "1"


// --------------------
// HARD RESET — full cvar baseline, stomps previous gametype
// --------------------

// Gametype
set g_gametype "14"                   // Arena Rooms (Rocket Arena)
set g_ruleset "2"                     // MuffMode ruleset; Arena owns its room rules

// Limits
set fraglimit "0"                     // each room owns its scoring
set timelimit "15"                    // whole-map/session backstop
set capturelimit "0"
set roundlimit "0"                    // each room owns its round series
set roundtimelimit "0"                // room rounds are uncapped by default

// Match flow
set g_match_lock "0"                  // new squads may queue while a challenge is active
set g_dm_do_warmup "1"
set g_round_countdown "5"
set g_dm_do_readyup "0"
set g_warmup_ready_percentage "0"
set g_dm_so_readyup "0"
set g_dm_timeout_length "60"          // shared timeout policy, applied per room
set g_dm_timeout_resume_countdown "5"

// Global room defaults. baseq2/arena.cfg may override by map and room ID.
set g_arena_config "arena.cfg"
set g_arena_legacy_idmap "0"          // fail closed on untagged maps
                                      // set 1 only for a known untagged RA2-only rotation
set g_arena_default_type "rocket"
set g_arena_players_per_team "1"
set g_arena_rounds "1"
set g_arena_competition "0"
set g_arena_unbalanced "0"
set g_arena_lock "0"
set g_arena_lock_count "6"            // minimum population for unanimous lock votes
set g_arena_max_players "0"
set g_arena_vote_time "30"
set g_arena_timeouts "3"

// Join / lobby / HUD behaviour
set g_dm_auto_join "0"                // players choose a room from the lobby
set g_dm_force_join "0"
set g_owner_auto_join "0"
set g_dm_crosshair_id "0"

// Bots
// Arena bots pick a room, follow players into it, and take an opposing team.
set bot_chat_enable "0"
set bot_skill "4"
set bot_minClients "2"
// Keep a bots-only room alive rather than ending the map the moment the last human leaves.
set g_dm_allow_no_humans "1"


// --------------------
// MAP SELECTION
// --------------------
// Clear map system from previous gametype
set g_map_list ""

// MuffMode does not redistribute Arena maps. Install compatible maps and set a
// tagged multi-room or classic-RA2 rotation here, for example:
// set g_map_list "ra2map1 ra2map2 ra2map3"
set g_map_pool ""
set g_map_list_shuffle "0"           // 0=sequential, 1=reshuffle on wrap, 2=shuffle once per gametype


// --------------------
// GAME MODIFICATIONS
// --------------------
set g_frenzy "0"
set g_nadefest "0"
set g_vampiric_damage "0"
set g_quadhog "0"
set g_infinite_ammo "0"              // each room owns finite/infinite ammo
set g_instagib "0"
set g_instagib_splash "0"
set g_weapon_projection "0"
set g_weapon_balance_dev "0"
set g_chaingun_max_shots "0"
set g_chaingun_damage "0"
set g_chaingun_hspread "0"
set g_chaingun_vspread "0"
set g_chaingun_spread_offset "0"
set g_machinegun_damage "0"
set g_machinegun_hspread "0"
set g_machinegun_vspread "0"
set g_hyperblaster_speed "0"
set g_railgun_damage "0"
set g_rocketlauncher_damage "0"
set g_rocketlauncher_speed "0"


// --------------------
// MATCH RULES
// --------------------
set g_dm_holdable_adrenaline "0"
set g_dm_spawn_farthest "0"
set g_corpse_sink_time "15"
set g_dm_no_fall_damage "0"
set g_dm_no_self_damage "0"          // room protection is configured below
set g_dm_respawn_delay_min "1"
set g_dm_respawn_point_min_dist "512"
set g_dm_respawn_point_min_dist_debug "0"
set g_dm_spawnpads "1"
set g_dm_player_spawn_rule "0"
set g_frag_messages "1"
set g_damage_scale "1.0"
set g_knockback_scale "1.0"
set g_mover_speed_scale "1"
set g_allow_techs "0"
set g_no_powerups "1"
set g_teleporter_freeze "0"
set g_dm_overtime "0"
set g_starting_health_bonus "0"

// Room loadout and protection defaults
set g_arena_start_health "100"
set g_arena_start_armor "100"
set g_arena_dmg_armor "0"            // legacy non-GT_ARENA arena-loadout switch
set g_arena_health_protect "1"       // protect self + team health
set g_arena_armor_protect "2"        // allow self-armor damage, protect teammates
set g_arena_falling_damage "1"
set g_arena_weapon_mask "255"        // all standard weapons, BFG bit 256 stays off
set g_arena_ammo_shells "100"
set g_arena_ammo_bullets "200"
set g_arena_ammo_grenades "20"
set g_arena_ammo_rockets "50"
set g_arena_ammo_cells "150"
set g_arena_ammo_slugs "50"
set g_arena_fast_switch "1"          // accelerated weapon switching
set g_arena_excessive "0"            // rapid fire, faster rockets, infinite ammo
set g_arena_rocket_speed "900"


// --------------------
// ITEM CONTROLS
// --------------------
set g_dm_powerup_drop "0"
set g_dm_powerups_style "0"          // 0=standard, 1=in-place respawn
set g_dm_random_items "0"
set g_dm_weapons_stay "1"
set g_weapon_respawn_time "0"
set g_instant_weapon_switch "1"       // fallback for non-arena paths


// --------------------
// TEAMPLAY
// --------------------
set g_teamplay_allow_team_pick "0"    // Arena assigns champion red and challenger blue
set g_teamplay_force_balance "0"
set g_friendly_fire "0"


// --------------------
// HOOK
// --------------------
set g_allow_grapple "0"
set g_grapple_offhand "0"
set g_grapple_damage "10"
set g_grapple_fly_speed "650"
set g_grapple_pull_speed "650"
set g_arena_grapple "0"              // selectable Grapple plus arena-scoped +hook permission


// --------------------
// CLIENT/PLAYER LOAD MANAGEMENT
// --------------------
set maxplayers "128"                  // full MuffMode lobby plus playable-arena capacity
set minplayers "2"


// --------------------
// ENTITY / ITEM OVERRIDES
// --------------------
set replace_item_power_screen "item_armor_combat"
set disable_item_power_shield "1"


// --------------------
// MAP-SPECIFIC ITEM REPLACEMENTS
// --------------------


// --------------------
// START MAP
// --------------------
