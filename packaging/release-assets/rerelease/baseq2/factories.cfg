// ============================================================================
//  MuffMode factory registry
// ----------------------------------------------------------------------------
//  A factory is a named gameplay preset: one base gametype plus cvar overrides
//  and structured directives. Nothing runs underneath one -- a setting no
//  factory states holds whatever server-base.cfg left in it. Selecting a
//  factory always triggers a map change; switching factories restores every
//  setting the outgoing one changed that the incoming one does not.
//
//  Layering:  server-base.cfg  <  factory  <  arena room  <  admin/vote
//
//  ---------------------------------------------------------------------------
//  Syntax
//  ---------------------------------------------------------------------------
//      factory <id> {                     // id: 1-31 chars of a-z 0-9 _ -
//                                         //   not a `factory` subcommand word
//          title    "<display name>"      // required; under 48 chars,
//                                         //   no \ ; or "
//          desc     "<one line>"          // optional, shown by `factory info`
//          base     <gametype short name> // required: ffa duel tdm ctf ca ft
//                                         //   strike rr lms horde arena
//          ruleset  <q2re|mm|q3a|q2reb|q|qc>
//          inherit  <earlier factory id>  // same base gametype only
//
//          maps     <map> <map> ...       // the rotation; repeat to add more
//          mappool  <map> <map> ...       // maps offered to votes and MyMap
//          rotation <sequential|shuffle-on-wrap|shuffle-per-gametype>
//          players  <min> <max>           // active players for this mode
//
//          set <cvar> <value>             // use "" to clear a cvar
//      }
//
//  An id beginning with _ is hidden from listings and the vote menu, but can
//  still be selected by name.
//
//  Naming: _base_<mode> is a hidden baseline every visible factory inherits;
//  <mode>_classic is the standard public-server version; <mode>_comp is the
//  same mode set up for organised play; insta*/vamp*/frenzy*/nade*/quad* are
//  mutator presets.
//
//  ---------------------------------------------------------------------------
//  Editing this file
//  ---------------------------------------------------------------------------
//  COPY IT FIRST. A package update overwrites factories.cfg. Copy it to your
//  own leaf name and point g_factory_file at your copy; later files override
//  earlier ones by id, so you can also load both and redefine only what you
//  want to change:
//
//      set g_factory_file "factories.cfg my-factories.cfg"
//
//  Never put a semicolon in a comment: the console splits the command buffer
//  on that character before it strips the comment marker, so the rest of the
//  line executes as a command. Use a full stop instead.
//
//  ---------------------------------------------------------------------------
//  Using them
//  ---------------------------------------------------------------------------
//  Commands:  factory                     show what is active and what fits
//             factory list [gametype|all] list ids
//             factory info <id>           show exactly what one changes
//             factory cvars [prefix]      list the settings a factory may set
//             factory diag <cvar>         show where a setting's value came from
//             factory <id>                select one            (admin)
//             factory none                clear back to defaults (admin)
//             factory reload              re-read this file      (admin)
//             sv factory <id|none>        select from the console
//  Vote:      callvote factory <id>       (vote flag 131072)
//  Cvars:     g_factory            the active id
//             g_factory_file       which files to load
//             g_votable_factories  which ids players may vote for
//             g_gametype_locked    1 pins the selection against admins and votes
// ============================================================================

// ============================================================================
//  MODE BASES -- hidden, inherit-only, one per gametype
// ============================================================================

factory _base_ffa {
    title    "Deathmatch"
    base     ffa
    ruleset  q2re
    players  2 12
    maps     q2dm1 q2dm2 q2dm3 q2dm5 q2dm6 q2dm7 q2dm8
    rotation shuffle-per-gametype
    set fraglimit                   30
    set g_allow_grapple             0
    set g_allow_techs               0
    set g_dm_crosshair_id           0
    set g_dm_force_join             1
    set g_dm_holdable_adrenaline    0
    set g_dm_overtime               0
    set g_dm_respawn_point_min_dist 512
    set g_dm_spawn_farthest         0
    set g_dm_weapons_stay           1
    set g_mover_speed_scale         1
    set g_no_powerups               1
    set g_owner_auto_join           0
    set g_warmup_ready_percentage   0
    set g_weapon_respawn_time       0
    set timelimit                   15
}

