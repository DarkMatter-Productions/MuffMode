// ============================================================================
//  MuffMode factory registry
// ----------------------------------------------------------------------------
//  A factory is a named gameplay preset: one base gametype plus a set of cvar
//  overrides and structured directives. Factories are how a MuffMode server is
//  configured for play -- they replaced the per-gametype gt-*.cfg files the mod
//  used to execute, so nothing runs underneath one. A setting no factory states
//  holds whatever server-base.cfg left in it.
//
//  Selecting a factory always triggers a map change, and everything it carries
//  is written before that map load, so map rotations, latched mutators and
//  spawn-time settings are all live when the level comes up.
//
//  Switching factories restores every setting the outgoing one changed and the
//  incoming one does not -- back to the value your own server-base.cfg produced.
//  That is why a factory may only touch settings on a fixed allowlist: the
//  restore can only be exact for what the system knows it owns.
//
//  Layering:  server-base.cfg  <  factory  <  arena room  <  admin or vote
//
//  ---------------------------------------------------------------------------
//  Syntax
//  ---------------------------------------------------------------------------
//      factory <id> {                     // id: 1-31 chars of a-z 0-9 _ -
//                                         //   not a `factory` subcommand word
//          title    "<display name>"      // required; published in server info,
//                                         //   so no \ ; or " and under 48 chars
//          desc     "<one line>"          // optional, shown by `factory info`
//          base     <gametype short name> // required: ffa duel tdm ctf ca ft
//                                         //   strike rr lms horde arena
//          ruleset  <q2re|mm|q3a|q2reb|q|qc>
//          inherit  <earlier factory id>  // same base gametype only
//
//          maps     <map> <map> ...       // the rotation; repeat to add more
//          mappool  <map> <map> ...       // maps offered to votes and MyMap
//          rotation <sequential|shuffle-on-wrap|shuffle-per-gametype>
//          players  <min> <max>           // active players for this mode
//
//          set <cvar> <value>             // use "" to clear a cvar
//      }
//
//  `maps`, `mappool`, `rotation` and `players` are directives rather than plain
//  `set` lines because they carry structure a bare string cannot: map names are
//  validated the same way the map system validates them anywhere else, and the
//  player limits are range-checked against each other.
//
//  An id beginning with _ is hidden from listings and from the vote menu, but
//  can still be selected by name.
//
//  ---------------------------------------------------------------------------
//  How the shipped catalogue is named
//  ---------------------------------------------------------------------------
//      _base_<mode>     hidden layer holding a mode's baseline; everything
//                       visible for that mode inherits it
//      <mode>_classic   the standard version of the mode -- what a public
//                       server should run
//      <mode>_comp      the same mode set up for organised play: everyone
//                       readies up, nobody joins or is thrown into a running
//                       match, ties go to overtime, teams are force balanced
//      insta*/vamp*/    the mutator presets, one per mode where the mutator
//      frenzy*/nade*/   makes sense
//      quad*
//
//  A `_comp` factory changes match CONDUCT, not weapon numbers -- those belong
//  to the ruleset, which a factory selects by name and never overrides.
//
//  ---------------------------------------------------------------------------
//  Editing this file
//  ---------------------------------------------------------------------------
//  COPY IT FIRST. A package update overwrites factories.cfg. Copy it to your own
//  leaf name in this folder and point g_factory_file at your copy; later files
//  override earlier ones by id, so you can also load both and redefine only what
//  you want to change:
//
//      set g_factory_file "factories.cfg my-factories.cfg"
//
//  A malformed definition is rejected on its own, named by file, line, id and
//  reason; the rest of the file still loads. If the whole document is unusable,
//  none of it is published and the previously working registry is kept -- a bad
//  edit cannot leave the server with no factories.
//
//  ---------------------------------------------------------------------------
//  Using them
//  ---------------------------------------------------------------------------
//  Commands:  factory                     show what is active and what fits
//             factory list [gametype|all] list ids
//             factory info <id>           show exactly what one changes
//             factory cvars [prefix]      list the settings a factory may set
//             factory diag <cvar>         show where a setting's value came from
//             factory <id>                select one            (admin)
//             factory none                clear back to defaults (admin)
//             factory reload              re-read this file      (admin)
//             sv factory <id|none>        select from the console
//  Vote:      callvote factory <id>       (vote flag 131072)
//  Cvars:     g_factory            the active id; set it with g_gametype to
//                                  match, or use `factory <id>` instead
//             g_factory_file       which files to load
//             g_votable_factories  which ids players may vote for
//             g_gametype_locked    1 pins the selection against admins and votes
// ============================================================================

// ============================================================================
//  MODE BASES
// ----------------------------------------------------------------------------
//  One hidden base per gametype, carrying everything that mode needs: ruleset,
//  player limits, map rotation, and every setting whose value differs from the
//  cvar default. These replace the per-gametype config files the mod used to
//  execute on a gametype change.
//
//  Hidden by the leading underscore, so they never appear in listings or votes,
//  but they remain valid `inherit` parents. Every variant below inherits its
//  mode base and states only its own differences.
// ============================================================================

factory _base_ffa {
    title    "Deathmatch"
    base     ffa
    ruleset  q2re
    players  2 12
    maps     q2dm1 q2dm2 q2dm3 q2dm5 q2dm6 q2dm7 q2dm8
    rotation shuffle-per-gametype
    set fraglimit                   30
    set g_allow_grapple             0
    set g_allow_techs               0
    set g_dm_crosshair_id           0
    set g_dm_force_join             1
    set g_dm_holdable_adrenaline    0
    set g_dm_overtime               0
    set g_dm_respawn_point_min_dist 512
    set g_dm_spawn_farthest         0
    set g_dm_weapons_stay           1
    set g_mover_speed_scale         1
    set g_no_powerups               1
    set g_owner_auto_join           0
    set g_warmup_ready_percentage   0
    set g_weapon_respawn_time       0
    set timelimit                   15
}

factory _base_duel {
    title    "Duel"
    base     duel
    ruleset  q2reb
    // Duel enforces its two arena slots itself and queues everyone else, so a
    // higher cap here would only mislead `factory info` into advertising a
    // twelve-player 1v1.
    players  2 2
    maps     q2dm1
    rotation shuffle-per-gametype
    set capturelimit               0
    set fraglimit                  20
    set g_allow_grapple            0
    set g_allow_techs              0
    set g_dm_allow_no_humans       0
    set g_dm_crosshair_id          0
    set g_dm_do_readyup            1
    set g_dm_holdable_adrenaline   0
    set g_dm_overtime              0
    set g_dm_spawn_farthest        0
    set g_match_lock               1
    set g_mover_speed_scale        1
    set g_no_powerups              1
    set g_owner_auto_join          0
    set g_teamplay_allow_team_pick 1
    set g_warmup_ready_percentage  1.0
    set g_weapon_respawn_time      15
