// ============================================================================
//  DEATHMATCH
// ----------------------------------------------------------------------------

// Stock Quake II deathmatch item economy: powerups back on the map, weapons
// vanish when taken. The shipped FFA preset is a modern pub config (weapons
// stay, no powerups); this factory is what makes "classic" a real claim rather
// than a relabel of the built-in `ffa`.
factory ffa_classic {
    title    "Classic Deathmatch"
    desc     "Stock Q2 deathmatch economy: powerups on the map, weapons vanish and respawn on 30s."
    base     ffa
    inherit  _base_ffa
    set g_no_powerups         0
    set g_dm_weapons_stay     0
    set g_weapon_respawn_time 30
}

// Tournament deathmatch. Free-for-all is normally a drop-in mode, so almost all
// of the competitive conduct has to be added here rather than inherited: the
// FFA base deliberately auto-joins arrivals and needs nobody to ready up.
// Powerup and weapon control stay in -- in FFA that IS the skill being tested.
factory ffa_comp {
    title    "Deathmatch - Competitive"
    desc     "Tournament FFA: 15 minutes on the timer, everyone readies up, overtime on a draw."
    base     ffa
    inherit  ffa_classic
    ruleset  q2reb
    players  2 8
    set fraglimit                 0     // the clock decides, not a frag race
    set g_dm_do_warmup            1
    set g_dm_do_readyup           1
    set g_warmup_ready_percentage 1.0   // every player, not a majority
    set g_warmup_countdown        15
    set g_match_lock              1     // nobody walks into a running match
    set g_dm_force_join           0
    set g_dm_allow_no_humans      0
    set g_dm_overtime             120
    set g_dm_random_items         0
    set mercylimit                0
}

// The house deathmatch: the FFA preset ships q2re with powerups and techs
// switched off. This is the opposite call -- MuffMode balance and the full item
// game. fraglimit/timelimit are deliberately absent; the preset's 30/15 are right.
factory house_dm {
    title    "House Deathmatch"
    desc     "MuffMode balance with powerups and techs switched back on."
    base     ffa
    inherit  _base_ffa
    ruleset  mm
    set g_no_powerups 0
    set g_allow_techs 1
}

// Everyone spawns holding a rocket launcher and never runs dry. Map weapons
// still spawn -- the allowlist has no cvar that removes weapons from maps, and
// MM_IsSafeFactoryValue rejects `;`, which is the separator Player_GiveStartItems
// splits on, so a factory can grant exactly one g_start_items entry and never a
// weapon-plus-ammo list. Hence rocket START plus g_infinite_ammo. Weapons stop
// staying and respawn slowly, so the map arsenal is a contested prize rather
// than a free alternative to the rockets you already hold.
factory ffa_rockets {
    title    "Rocket Deathmatch"
    desc     "Spawn with the rocket launcher and never run dry. Map weapons still spawn, but rarely."
    base     ffa
    inherit  _base_ffa
    set g_start_items         weapon_rocketlauncher 1
    set g_infinite_ammo       1     // the pickup's rocket count is unplayable as a start weapon
    set g_dm_weapons_stay     0
    set g_weapon_respawn_time 45
    set g_dm_no_fall_damage   0     // rocket jumps stay costly; see ffa_rockets_air below
}

// Same idea with the mobility gloves off: no fall damage, so rocket jumping is
// free and vertical routes open up.
factory ffa_rockets_air {
    title    "Rocket Deathmatch (Air)"
    desc     "Rocket start with fall damage off, so rocket jumping and vertical routes are free."
    base     ffa
    inherit  ffa_rockets
    set g_dm_no_fall_damage 1
}

// Replaces the retired GT_INSTAGIB gametype and carries the old _base_instagib
// tuning; its timelimit 15 is already the FFA preset's, so only fraglimit moves.
factory instagib {
    title    "Instagib"
    desc     "Railgun only, one shot one kill. Forty frags."
    base     ffa
    inherit  _base_ffa
    set g_instagib        1
    set g_instagib_splash 0
    set fraglimit         40
}

// Rail splash is knockback with the damage zeroed, so this is the rail-jump
// variant, not a splash-damage one. Fall damage comes off with it or the
// landing kills the jumper at the 100 hp deathmatch spawn.
factory instagib_jump {
    title    "Instagib (Rail Jump)"
    desc     "Instagib with rail-jump knockback. The blast deals no damage and fall damage is off."
    base     ffa
    inherit  instagib
    set g_instagib_splash   1
    set g_dm_no_fall_damage 1
}

// Frenzy halves weapon fire time, which applies to the rail as much as anything
// else, so the rail cycles about twice as fast. Frags arrive at roughly double
// the rate; fraglimit follows.
factory instagib_frenzy {
    title    "Instagib Frenzy"
    desc     "Instagib at double rail fire rate. Sixty frags because they land twice as fast."
    base     ffa
    inherit  instagib
    set g_frenzy  1
    set fraglimit 60
}

// Replaces the retired GT_NADEFEST gametype, carrying its 20/5 tuning. The
// short clock is deliberate: it is a palate cleanser between real matches.
factory nadefest {
    title    "Nade Fest"
    desc     "Grenades and nothing else. Twenty frags or five minutes, whichever lands first."
    base     ffa
    inherit  _base_ffa
    set g_nadefest 1
    set fraglimit  20
    set timelimit  5
}

// Vampiric tuning stated in full, deliberately, since none of these cvars appear
// in _base_ffa and the engine defaults (0.67 leech, 9999 cap, decay to death)
// are not what a public FFA wants:
//   percentile 0.5   -- half of damage dealt returns as health. The 0.67 default
//                       lets a player who wins one fight walk out of it healthier
//                       than they went in, which snowballs.
//   health_max 200   -- a leech ceiling. Uncapped, the run leader banks hundreds
//                       of hit points nobody can chew through. 200 also puts the
//                       hoarder in the 2 hp/sec decay band: the tick is
//                       floor((health-1)/max_health)+1 against a 100 hp spawn.
//   exp_min 25       -- decay stops at 25 hp. Attrition should apply pressure,
//                       not hand out frags to nobody.
// Health pickups are already gone: g_vampiric_damage drops IF_HEALTH in
// ItemSpawnAllowed. Armor still spawns, and it is the counterplay.
factory vampffa {
    title    "Vampiric Deathmatch"
    desc     "Damage you deal heals you for half of it, capped at 200, while your health bleeds away."
    base     ffa
    inherit  _base_ffa
    set g_vampiric_damage     1
    set g_vampiric_percentile 0.5
    set g_vampiric_health_max 200
    set g_vampiric_exp_min    25
    set fraglimit             20    // opponents heal, so kills are slower than stock FFA
}

// Faster weapons, faster rockets, regenerating ammo. Kills land far quicker than
// stock, so the frag target rises to keep the round about the same length.
factory frenzyffa {
    title    "Weapons Frenzy"
    desc     "Double fire rate, faster rockets, ammo regenerates. Fifty frags."
    base     ffa
    inherit  _base_ffa
    set g_frenzy  1
    set fraglimit 50
}

// Quad Hog rewrites OnSameTeam: while g_quadhog is set, any two players count as
// teammates unless one of them is holding the quad. With friendly fire off --
// which is the FFA preset -- that zeroes all damage between non-holders, so the
// only fights that can happen are with the hog. That IS the mode, and it is why
// frags accumulate far more slowly than the preset's 30 assumes.
//
// No g_no_powerups line is needed: QuadHog_Spawn builds the quad directly
// instead of going through the spawn filter, and the filter strips map item_quad
// under quadhog anyway, so the preset's g_no_powerups 1 is orthogonal. The
// preset's g_dm_powerup_drop 1 is already what passes the quad on death.
//
// The same OnSameTeam override is why there is no Quad Hog CTF or Freeze Tag
// below: in those modes it disables the objective interaction outright (nobody
// can stop a flag carrier, nobody but the hog can freeze anyone), and no cvar
// setting brings it back.
factory quadffa {
    title    "Quad Hog"
    desc     "One quad, everyone hunts whoever has it. Only fights involving the hog can happen."
    base     ffa
    inherit  _base_ffa
    set g_quadhog 1
    set fraglimit 20
}


// ============================================================================
//  DUEL
// ----------------------------------------------------------------------------

// The duel preset is already the competitive shape: q2reb, match lock, all-ready
// start, weapons don't stay, 15s weapon respawn. The one thing it gets wrong for
// tournament play is the frag limit -- a duel should be decided by the clock, not
// ended early by whoever hits 20 first.
factory duel_classic {
    title    "Duel"
    desc     "One on one, ten minutes, no frag limit. Both players ready up before the clock starts."
    base     duel
    inherit  _base_duel
    set fraglimit 0
}

// Tournament duel. The base already readies both players up and locks the
// match; what this adds is the part that decides a close game honestly -- a
// draw goes to overtime instead of standing, and the warmup countdown is long
// enough to actually load in and settle before the clock starts.
factory duel_comp {
    title    "Duel - Competitive"
    desc     "Tournament one on one: 10 minutes, overtime on a draw, no mid-match joins."
    base     duel
    inherit  duel_classic
    set g_dm_do_warmup      1
    set g_warmup_countdown  15      // load in, pick a spawn, settle
    set g_dm_overtime       120     // a duel that ends level is not a result
    set g_dm_force_join     0       // a spectator watching a match stays one
    set mercylimit          0       // a tournament game is played out
}

// The house ruleset instead of q2reb: lighter rockets, stronger rail knockback,
// tighter slugs, Muff Mode powerup flow.
factory duel_mm {
    title    "Duel (Muff Mode Ruleset)"
    desc     "The same competitive duel on the Muff Mode ruleset instead of Q2RE Balanced."
    base     duel
    inherit  duel_classic
    ruleset  mm
}

// The preset's 20 frags in 10 minutes is already the right pace for instagib,
// so this is the mutator and nothing else.
factory instaduel {
    title    "Instagib Duel"
    desc     "One on one, railgun only. Twenty frags or ten minutes."
    base     duel
    inherit  _base_duel
    set g_instagib        1
    set g_instagib_splash 0
}

// Same leech and cap as vampffa, but exp_min 1 instead of 25. In a 1v1 a floor
// of 25 lets a losing player hide indefinitely at a survivable 25 hp; a floor of
// 1 still never kills by attrition, but leaves a staller one hit from dead, so
// disengaging costs something.
factory vampduel {
    title    "Vampiric Duel"
    desc     "Duel where damage heals you for half of it. Decay floors at 1 hp, so hiding is not safe."
    base     duel
    inherit  _base_duel
    set g_vampiric_damage     1
    set g_vampiric_percentile 0.5
    set g_vampiric_health_max 200
    set g_vampiric_exp_min    1
    set fraglimit             15    // both players heal; 15 keeps it inside the ten minutes
}


// ============================================================================
//  TEAM DEATHMATCH
// ----------------------------------------------------------------------------

// Stock-feeling team deathmatch, and the layer every TDM variant below builds
// on. Ruleset is the only real departure from the _base_tdm layer: q2re instead
// of the shipped q2reb rebalance.
factory tdm_classic {
    title    "Team Deathmatch"
    desc     "Classic Q2 team deathmatch: 100 team frags, twenty minutes, balanced teams."
    base     tdm
    inherit  _base_tdm
    ruleset  q2re
    set fraglimit                100
    set timelimit                20
    set g_teamplay_force_balance 1
}

// Competitive counterpart, deliberately NOT inheriting tdm_classic so it keeps
// the shipped q2reb ruleset. Restores the vanilla 30s weapon respawn so weapon
// control and item timing actually matter.
factory tdm_comp {
    title    "Team Deathmatch - Competitive"
    desc     "Timed 15-minute TDM on the q2reb rebalance; 30s weapon respawns reward item timing."
    base     tdm
    inherit  _base_tdm
    players  4 8
    set fraglimit                0        // timed match only, no frag race
    set timelimit                15
    set g_teamplay_force_balance 1
    set g_quick_weapon_switch    1
    set g_weapon_respawn_time    30       // vanilla Q2 timing; makes weapon control a skill
    set g_dm_weapons_stay        0        // ...which only bites if they can be taken
    set g_dm_do_warmup           1
    set g_warmup_countdown       15
    set g_dm_force_join          0
    set g_dm_overtime            120
    set mercylimit               0
}

// Rail-only TDM. Splash is on for rail jumps and fall damage is off so those
// jumps survive the landing; friendly fire off because one rail is one kill and
// the TDM preset ships friendly fire ON.
factory instatdm {
    title    "Insta Team Deathmatch"
    desc     "Railgun only. 50 team frags, rail jumps enabled, no friendly fire."
    base     tdm
    inherit  tdm_classic
    set g_instagib          1
    set g_instagib_splash   1
    set g_dm_no_fall_damage 1
    set g_friendly_fire     0
    set fraglimit           50
    set timelimit           15
}

// Damage heals you, health pickups are removed, and health bleeds off over time.
// Friendly fire MUST stay off here or teammates become a healing pool. The frag
// target comes down from tdm_classic's 100 for the same reason vampffa's does:
// opponents heal, so kills are slower.
factory vamptdm {
    title    "Vampiric Team Deathmatch"
    desc     "Damage heals you, no health pickups, health bleeds down to 25."
    base     tdm
    inherit  tdm_classic
    set g_vampiric_damage     1
    set g_vampiric_percentile 0.5      // stated, not left to the 0.67 engine default
    set g_vampiric_health_max 200      // healing cap: two stacks, not unbounded
    set g_vampiric_exp_min    25       // decay floor; teams can't disengage to heal, so don't bleed out
    set g_friendly_fire       0        // otherwise teammates are a free health source
    set fraglimit             60
    set timelimit             15
}

// Frenzy multiplies rate of fire and regenerates ammo, so the frag pace roughly
// doubles; limits and weapon availability are raised to match.
factory frenzytdm {
    title    "Frenzy Team Deathmatch"
    desc     "Fast fire, regenerating ammo, quick switch. 150 frags, weapons stay."
    base     tdm
    inherit  tdm_classic
    set g_frenzy          1
    set g_dm_weapons_stay 1      // everyone arms up immediately; frenzy is about the fight, not the pickup race
    set g_friendly_fire   0      // sustained fire rates make FF unplayable in teams
    set fraglimit         150
    set timelimit         15
}

// Quad Hog with team scoring. Read the quadffa note first: while the quad is
// live, only fights involving the holder can happen at all, so this is a
// team-scored race for one prize rather than a team deathmatch with a powerup.
// Friendly fire has to stay off -- turning it on would not restore team-vs-team
// combat, it would only make every non-holder kill score -1.
factory quadtdm {
    title    "Quad Hog Team Deathmatch"
    desc     "One roaming quad, team scored. Only kills involving the holder land or count."
    base     tdm
    inherit  tdm_classic
    set g_quadhog       1
    set g_no_powerups   1        // strips map powerups; the hog quad spawns independently
    set g_friendly_fire 0
    set fraglimit       25       // only hog-involved kills score, so 100 is unreachable
    set timelimit       10
}

// Grenades only. Short and loud.
factory nadetdm {
    title    "Nade Fest Team Deathmatch"
    desc     "Grenades only, 50 team frags, ten minutes."
    base     tdm
    inherit  tdm_classic
    set g_nadefest      1
    set g_friendly_fire 0        // constant splash overlap in team play
    set fraglimit       50
    set timelimit       10
}


// ============================================================================
//  CAPTURE THE FLAG
// ----------------------------------------------------------------------------

// Straight CTF, and the layer every CTF variant below builds on: the shipped
// capture limit, a full twenty minutes, techs off so the match is decided by
// flag play rather than tech luck.
factory ctf_classic {
    title    "Classic CTF"
    desc     "Eight captures, twenty minutes, no techs, balanced teams."
    base     ctf
    inherit  _base_ctf
    set timelimit                20
    set g_allow_techs            0
    set g_teamplay_force_balance 1
}

// Competitive CTF. No grapple, no techs, friendly fire live, and weapons no
// longer stay -- so map control, not respawn spam, decides the flag fight.
// League CTF. Grapple stays -- it is core Q2 CTF movement, and dropping it is a
// house rule, which is what ctf_ironman below is for. What changes is the
// economy: weapons have to be fought for and held, and a level score goes to
// overtime rather than standing as a draw.
factory ctf_comp {
    title    "CTF - Competitive"
    desc     "League CTF: eight captures or twenty minutes, 30s weapon respawns, overtime on a draw."
    base     ctf
    inherit  ctf_classic
    ruleset  q2reb
    players  4 10
    set capturelimit              8
    set g_dm_weapons_stay         0
    set g_weapon_respawn_time     30
    set g_dm_do_warmup            1
    set g_warmup_countdown        15
    set g_dm_force_join           0
    set g_dm_overtime             120
    set mercylimit                0
}

factory ctf_ironman {
    title    "CTF - Ironman"
    desc     "No grapple, no techs, friendly fire on, weapons must be fought for."
    base     ctf
    inherit  ctf_classic
    ruleset  q2reb
    set g_allow_grapple       0
    set g_friendly_fire       1
    set g_dm_weapons_stay     0
    set g_weapon_respawn_time 30     // vanilla timing; weapon control becomes a real objective
    set g_dm_powerup_drop     0      // a defended powerup can't be farmed off the carrier's corpse
}

// The flagship insta variant. Rail-only offence makes flag runs about movement,
// so splash rail jumps are enabled and fall damage is removed -- without that, a
// 100hp player dies on the landing and rail jumping is unusable. The grapple
// survives instagib (it is granted from g_allow_grapple, not the item economy),
// and techs are already gone with every other item.
factory instactf {
    title    "Insta CTF"
    desc     "Railgun only, rail jumping enabled, grapple on. Five captures, fifteen minutes."
    base     ctf
    inherit  ctf_classic
    set g_instagib          1
    set g_instagib_splash   1     // non-damaging blast: this is the rail jump
    set g_dm_no_fall_damage 1     // required, or every rail jump kills its own user
    set capturelimit        5
    set timelimit           15
}

// Attrition CTF: no health on the map, damage is your only heal, and carrying
// the flag while bleeding out is the whole tension of the mode.
factory vampctf {
    title    "Vampiric CTF"
    desc     "Damage heals you, no health pickups, health drains to 25. Five captures."
    base     ctf
    inherit  ctf_classic
    set g_vampiric_damage     1
    set g_vampiric_percentile 0.5
    set g_vampiric_health_max 200
    set g_vampiric_exp_min    25   // floor so a lone flag runner isn't killed by the clock
    set capturelimit          5
}

// Fast fire and regenerating ammo turn defence into a wall, so the capture
// limit goes up and the clock comes down.
factory frenzyctf {
    title    "Frenzy CTF"
    desc     "Fast fire, regenerating ammo, quick switch. Ten captures, fifteen minutes."
    base     ctf
    inherit  ctf_classic
    set g_frenzy     1
    set capturelimit 10
    set timelimit    15
}

// Grenades only, grapple on -- the hook is the only reliable mobility left.
factory nadectf {
    title    "Nade Fest CTF"
    desc     "Grenades and the grapple. Five captures, fifteen minutes."
    base     ctf
    inherit  ctf_classic
    set g_nadefest   1
    set capturelimit 5
    set timelimit    15
}


// ============================================================================
//  CLAN ARENA
// ----------------------------------------------------------------------------

// The 15-minute timelimit would cut a first-to-8 short on almost every map, so
// the clock comes off and the rounds decide.
factory ca_classic {
    title    "Clan Arena"
    desc     "First to eight round wins, 200/200 full stack, no match clock."
    base     ca
    inherit  _base_ca
    ruleset  mm
    set g_arena_start_health 200
    set g_arena_start_armor  200
    set timelimit            0      // rounds decide; a 15 min cap ends most first-to-8s early
}

// Competitive layer on the same stack. In arena modes self-damage never reaches
// health at all; g_arena_dmg_armor is what lets it reach armor, so a rocket jump
// costs stack instead of being free.
// The CA base is set up for public play: it auto-joins arrivals and needs
// nobody to ready up, because a round mode with an empty warmup is dead air.
// A match server wants the opposite, so the readyup flow is added here rather
// than pushed down into the base where it would hurt the casual case.
factory ca_comp {
    title    "Clan Arena - Competitive"
    desc     "Match CA: first to ten rounds, self-damage on, no grapple, everyone readies up."
    base     ca
    inherit  ca_classic
    players  4 8
    set g_arena_dmg_armor         1     // rocket jumps cost armour, like the rest of Q2
    set g_allow_grapple           0
    set g_teamplay_force_balance  1
    set roundlimit                10
    set g_dm_do_warmup            1
    set g_dm_do_readyup           1
    set g_warmup_ready_percentage 1.0
    set g_warmup_countdown        15
    set g_match_lock              1
    set g_dm_force_join           0
    set g_dm_allow_no_humans      0
    set mercylimit                0
}

factory instaca {
    title    "Insta Clan Arena"
    desc     "Rail-only elimination. Every hit kills, so the stack drops to 100/0 rather than lying."
    base     ca
    inherit  ca_classic
    set g_instagib           1
    set g_instagib_splash    1      // no splash damage; this is rail-jump knockback
    set g_dm_no_fall_damage  1      // fall damage has no attacker, so arena self-damage rules miss it
    set g_arena_start_health 100
    set g_arena_start_armor  0
    set roundlimit           10     // insta rounds resolve in seconds; 10 wins keeps the match length
    set roundtimelimit       2
}

// Arena spawns set max_health to g_arena_start_health, so the decay tick is
// 1 hp/sec at or below the spawn value and 2 hp/sec above it -- leeched
// overstack bleeds off twice as fast as it was earned.
factory vampca {
    title    "Vampiric Clan Arena"
    desc     "Deal damage to heal. Start 100/50, leech half, decay stops at 25. Camping starves."
    base     ca
    inherit  ca_classic
    set g_vampiric_damage     1
    set g_arena_start_health  100   // small stack: health has to be earned back, not spawned with
    set g_arena_start_armor   50    // armor is the one resource leeching cannot replace
    set g_vampiric_percentile 0.5   // 0.67 default returns 67 hp on one rocket at this stack; half is enough
    set g_vampiric_health_max 200   // fight well and you double your spawn health, no further
    set g_vampiric_exp_min    25    // decay floor: nobody is ELIMINATED by the tick, only starved down to 25
    set roundtimelimit        2     // the decay already forces engagement; a 3 min cap is dead weight
}

factory frenzyca {
    title    "Frenzy Clan Arena"
    desc     "Weapons Frenzy: faster fire, faster rockets, regenerating ammo. Short rounds, big stack."
    base     ca
    inherit  ca_classic
    set g_frenzy       1
    set roundlimit     10
    set roundtimelimit 2            // frenzy rounds end well inside 2 min; the extra minute is standoff
}

// NadeFest as a modifier on CA: infinite hand grenades and nothing else.
factory nadeca {
    title    "Nade Arena"
    desc     "Grenades only, round-based elimination. 100/100 so a stack cannot outlast the arcs."
    base     ca
    inherit  ca_classic
    set g_nadefest           1
    set g_arena_start_health 100    // 200/200 vs grenades only turns every round into a timeout
    set g_arena_start_armor  100
    set roundtimelimit       2
}


// ============================================================================
//  FREEZE TAG
// ----------------------------------------------------------------------------

factory ft_classic {
    title    "Freeze Tag"
    desc     "First to eight round wins; four-minute rounds leave room for thaw comebacks."
    base     ft
    inherit  _base_ft
    set timelimit                0  // rounds decide the match, not a 15 min clock
    set roundtimelimit           4  // thawing is the comeback mechanic; 3 min cuts it off mid-rescue
    set g_teamplay_force_balance 1  // a one-player edge snowballs hard once freezes stack up
}

// Match Freeze Tag. Same shape as ca_comp -- the FT base is a public-play base
// with no readyup -- plus a longer round cap, because a rescue that would have
// turned the round is worthless if the clock kills it first.
factory ft_comp {
    title    "Freeze Tag - Competitive"
    desc     "Match Freeze Tag: first to ten rounds, five-minute rounds, everyone readies up."
    base     ft
    inherit  ft_classic
    players  4 8
    set roundlimit                10
    set roundtimelimit            5
    set g_dm_do_warmup            1
    set g_dm_do_readyup           1
    set g_warmup_ready_percentage 1.0
    set g_warmup_countdown        15
    set g_match_lock              1
    set g_dm_force_join           0
    set g_dm_allow_no_humans      0
    set g_allow_grapple           0     // a grapple rescue trivialises the thaw
    set mercylimit                0
}

// Splash stays off here on purpose: its knockback is derived from the raw damage
// figure even though the damage itself is zeroed, so a rail near a frozen body
// would shove it out of thaw range for free.
factory instaft {
    title    "Insta Freeze Tag"
    desc     "Rail-only. One hit freezes, so the whole game is thaw discipline. No body shoving."
    base     ft
    inherit  ft_classic
    set g_instagib        1
    set g_instagib_splash 0
    set roundtimelimit    2         // no item chase and one-hit freezes: 4 min is twice what a round needs
}

factory vampft {
    title    "Vampiric Freeze Tag"
    desc     "Damage heals, up to 150. Decay stops at 30, so only an enemy can freeze you."
    base     ft
    inherit  ft_classic
    set g_vampiric_damage     1
    set g_vampiric_percentile 0.5
    set g_vampiric_health_max 150   // 100 hp DM spawn; leech overheals to 150, which bleeds at 2 hp/sec
    set g_vampiric_exp_min    30    // decay floor: a freeze always belongs to a player, never to the tick
    set roundtimelimit        3     // attrition shortens rounds; back off the 4 min thaw allowance
}

factory frenzyft {
    title    "Frenzy Freeze Tag"
    desc     "Weapons Frenzy with the map arsenal: faster fire, regenerating ammo, permanent pickups."
    base     ft
    inherit  ft_classic
    set g_frenzy              1
    set g_dm_weapons_stay     1     // frenzy is about firing, not queuing on a 15 s weapon respawn
    set g_weapon_respawn_time 0
    set roundtimelimit        3
}


// ============================================================================
//  CAPTURE STRIKE
// ----------------------------------------------------------------------------

factory strike_classic {
    title    "Capture Strike"
    desc     "Attack and defend on CTF maps; nine team points, two-minute turns, balanced teams."
    base     strike
    inherit  _base_strike
    ruleset  mm
    set capturelimit             9  // 3 points max per turn -> a 6-8 turn match, not the 15-point marathon
    set g_teamplay_force_balance 1  // turns alternate attack/defend; an uneven side breaks both halves
}

// Match Capture Strike. The strike base already readies up and locks the match;
// this fixes the sides -- turns alternate attack and defend, so a team that
// changes shape between halves has not played the same match as its opponent.
factory strike_comp {
    title    "Capture Strike - Competitive"
    desc     "Match Strike: nine points, fixed teams, no mid-match joins, everyone readies up."
    base     strike
    inherit  strike_classic
    players  4 10
    set g_dm_do_warmup            1
    set g_warmup_countdown        15
    set g_dm_force_join           0
    set g_teamplay_allow_team_pick 0    // sides are set before the match, not during it
    set mercylimit                0
}

// Splash stays off: rail jumps would put attackers on the enemy flag inside a
// 2 min turn on most CTF layouts.
factory instastrike {
    title    "Insta Strike"
    desc     "Rail-only attack and defend. Armor goes to zero because every rail is lethal anyway."
    base     strike
    inherit  strike_classic
    set g_instagib          1
    set g_instagib_splash   0
    set g_arena_start_armor 0
}

factory vampstrike {
    title    "Vampiric Strike"
    desc     "One life per turn, but damage heals you to 150. Decay stops at 50 so the clock decides."
    base     strike
    inherit  strike_classic
    set g_vampiric_damage     1
    set g_vampiric_percentile 0.5
    set g_vampiric_health_max 150   // 100/100 spawn; a good defensive stand is worth half a stack back
    set g_vampiric_exp_min    50    // decay floor: a turn is won on the flag or the clock, not by bleed-out
}


// ============================================================================
//  RED ROVER
// ----------------------------------------------------------------------------

factory rr_classic {
    title    "Red Rover"
    desc     "Six rounds, most frags wins; no clock, so the round count is what ends the match."
    base     rr
    inherit  _base_rr
    ruleset  mm
    set roundlimit 6                // 6 rounds x 3 min cap ~= 18 min, and it is now the real match ender
    set timelimit  0
}

factory instarr {
    title    "Insta Red Rover"
    desc     "Rail-only defection. Every hit swaps a side; armor is zero because it could never stop one."
    base     rr
    inherit  rr_classic
    set g_instagib           1
    set g_instagib_splash    1      // rail-jump knockback, no splash damage -- mobility is the whole appeal
    set g_dm_no_fall_damage  1      // or the jump kills its own user off a 100 hp stack
    set g_arena_start_armor  0
    set roundtimelimit       2      // teams collapse onto one side in seconds at this lethality
}

factory vamprr {
    title    "Vampiric Red Rover"
    desc     "Damage heals you to 200. Decay stops at 20, so a side-swap is a frag, not a bleed-out."
    base     rr
    inherit  rr_classic
    set g_vampiric_damage     1
    set g_vampiric_percentile 0.6   // RR scores individual frags; reward the player driving the swaps
    set g_vampiric_health_max 200   // double the 100 hp arena spawn, bleeding at 2 hp/sec while over it
    set g_vampiric_exp_min    20
}

factory frenzyrr {
    title    "Frenzy Red Rover"
    desc     "Weapons Frenzy: faster fire, faster rockets, regenerating ammo, constant defection."
    base     rr
    inherit  rr_classic
    set g_frenzy       1
    set roundtimelimit 2
}


// ============================================================================
//  LAST MAN STANDING
// ----------------------------------------------------------------------------

factory lms_classic {
    title    "Last Man Standing"
    desc     "First to five round wins, one life a round, no match clock."
    base     lms
    inherit  _base_lms
    ruleset  mm
    set roundlimit 5                // 3 wins ends a lobby in minutes; 5 is a match
    set timelimit  0
}

factory instalms {
    title    "Insta LMS"
    desc     "Rail-only elimination. A 150/150 stack means nothing when every hit kills, so it is 100/0."
    base     lms
    inherit  lms_classic
    set g_instagib           1
    set g_instagib_splash    1
    set g_dm_no_fall_damage  1      // splash is knockback only; without this the rail jump kills the jumper
    set g_arena_start_health 100
    set g_arena_start_armor  0
    set roundtimelimit       2
}

// The one place in this catalogue where the vampiric decay is deliberately left
// lethal: exp_min is stated as 0 so a player hiding out the round bleeds to
// death. In an FFA elimination mode that is the anti-camping rule, not a hazard
// -- there is no team to be let down by it. It is written out rather than left
// to the engine default so an operator's own g_vampiric_exp_min cannot silently
// turn the mode's advertised behaviour off.
factory vamplms {
    title    "Vampiric LMS"
    desc     "Start 100/100 and heal by dealing damage, up to 250. Hide and the decay bleeds you out."
    base     lms
    inherit  lms_classic
    set g_vampiric_damage     1
    set g_arena_start_health  100   // down from 150: the stack is earned in the round, not handed out
    set g_arena_start_armor   100
    set g_vampiric_percentile 0.75  // fewest targets of any mode here, so each hit has to pay more
    set g_vampiric_health_max 250   // decay scales with the spawn value: 2 hp/sec over 100, 3 over 200
    set g_vampiric_exp_min    0     // lethal floor, stated on purpose
}


// ============================================================================
//  HORDE
// ----------------------------------------------------------------------------

// The tuned 12-wave run, with the one change a co-op squad actually needs: map
// weapons persist, so six fighters are not fighting each other over the single
// rocket launcher on the level.
factory horde_classic {
    title    "Horde Classic"
    desc     "Twelve waves; map weapons stay so a whole squad can arm up."
    base     horde
    inherit  _base_horde
    set g_dm_weapons_stay 1
}

// roundlimit 0 is what makes Horde endless: the match-end check returns early on
// roundlimit <= 0, so no wave count ever ends the run. Past
// g_horde_content_peak_wave (12) the late-wave systems take over -- budget taper,
// ramped alive cap, on-category themed waves, steady champions.
factory horde_endless {
    title    "Endless Horde"
    desc     "No wave limit. Past wave 12 the late-wave escalation curve takes over."
    base     horde
    inherit  horde_classic
    set roundlimit 0
}

// Standalone, not inheriting horde_classic: scarce weapons are the point, so
// g_dm_weapons_stay stays at the preset's 0.
factory horde_hard {
    title    "Horde Hardcore"
    desc     "Twenty waves, friendly fire on, weapons respawn half as often."
    base     horde
    inherit  _base_horde
    set roundlimit            20     // 8 waves past the wave-12 content peak
    set g_friendly_fire       1      // Horde is InCoopStyle, so this really does enable squad damage
    set g_weapon_respawn_time 120    // literal seconds in Horde; preset is 60
}

// Vampiric strips every health pickup from the map (ItemSpawnAllowed drops
// IF_HEALTH while g_vampiric_damage is set), so the only way back up is hurting
// monsters. A monster is never OnSameTeam with a player, so leeching works on
// them; friendly fire stays off, so you cannot leech off a teammate.
factory vamphorde {
    title    "Vampiric Horde"
    desc     "No health pickups. Damage dealt is the only healing, and it bleeds back down."
    base     horde
    inherit  horde_classic
    set g_vampiric_damage     1
    set g_vampiric_percentile 0.67  // the engine default, written out so a server config cannot move it
    set g_vampiric_health_max 200   // hard cap; the default 9999 lets a good wave snowball forever
    set g_vampiric_exp_min    50    // decay stops at 50, so a lull between waves cannot bleed the squad out
}


// ============================================================================
//  MUFFMODE ARENA
// ----------------------------------------------------------------------------
//  Almost everything here belongs to the room, not the server: type, rounds,
//  weapon mask, ammo, protection and per-room loadout all come from
//  baseq2/arena.cfg keyed by map and room ID, and g_arena_dmg_armor is the
//  legacy non-GT_ARENA switch that multi-room Arena does not read at all. That
//  leaves exactly two session-scope knobs worth naming: timelimit ends the map,
//  roundtimelimit caps a room's round.
// ============================================================================

factory arena_ra2 {
    title    "MuffMode Arena"
    desc     "Independent RA2/RA3 rooms; rooms own their settings, this owns the clocks."
    base     arena
    inherit  _base_arena
    set timelimit      30        // preset's 15 cuts challenge queues short on a busy multi-room map
    set roundtimelimit 5         // preset is 0 (uncapped); a stalemate must not hold a room's queue hostage
}


// ============================================================================
//  DEVELOPMENT
// ----------------------------------------------------------------------------
//  A leading underscore hides these from listings and from the vote menu. They
//  are still selectable by name by an operator who asks for them.
// ============================================================================

// Free-flight testing: nothing ends, nothing runs out, nothing hurts you.
factory _sandbox {
    title    "Dev Sandbox"
    desc     "No limits, infinite ammo, no self or fall damage."
    base     ffa
    set fraglimit               0
    set timelimit               0
    set g_infinite_ammo         1
    set g_dm_weapons_stay       1
    set g_instant_weapon_switch 1
    set g_dm_no_self_damage     1
    set g_dm_no_fall_damage     1
}

// Unattended Horde soak: _base_horde already allows a bots-only match
// (g_dm_allow_no_humans 1), so this runs the director for hours without a human
// present and without ammo starvation or self-inflicted deaths skewing what the
// late-wave curve is doing.
factory _horde_soak {
    title    "Horde Soak Test"
    desc     "Endless waves for unattended bot soaks: infinite ammo, no self damage."
    base     horde
    inherit  horde_endless
    set g_infinite_ammo     1
    set g_dm_no_self_damage 1
    set g_dm_no_fall_damage 1
}
