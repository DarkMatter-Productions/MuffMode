// --------------------
// HORDE CONFIG
// --------------------


// --------------------
// SERVER IDENTITY
// --------------------
set hostname "Horde"
set g_gametype_cfg "1"


// --------------------
// HARD RESET — full cvar baseline, stomps previous gametype
// --------------------

// Gametype
set g_gametype "10"                   // Horde
set g_ruleset "4"                     // 1=Q2RE, 2=Muff Mode, 3=Q3A, 4=Q2RE Balanced, 6=QC

// Limits
set fraglimit "0"
set timelimit "0"
set capturelimit "8"
set roundlimit "12"
set roundtimelimit "0"

// Match flow
set g_match_lock "0"
set g_dm_do_warmup "1"
set g_round_countdown "10"
set g_dm_do_readyup "0"
set g_warmup_ready_percentage "0"
set g_dm_so_readyup "0"

// Join / lobby / HUD behaviour
set g_dm_auto_join "0"
set g_dm_force_join "1"
set g_owner_auto_join "0"
set g_dm_crosshair_id "0"

// Bots
set bot_chat_enable "0"
set bot_skill "4"
set bot_minClients "0"
set g_dm_allow_no_humans "1"         // allow match to run with bots only


// --------------------
// MAP SELECTION
// --------------------
// Clear map system from previous gametype
set g_map_list ""
set g_map_list_shuffle "0"

// g_map_pool is available for vote but not auto-rotated
set g_map_list "q2dm1 q2dm2 q2dm3 q2dm5 q2dm6 q2dm7 q2dm8"
set g_map_pool ""
set g_map_list_shuffle "2"           // 0=sequential, 1=shuffle once, 2=random each map change


// --------------------
// GAME MODIFICATIONS
// --------------------
set g_frenzy "0"
set g_nadefest "0"
set g_vampiric_damage "0"
set g_quadhog "0"
set g_instagib "0"
set g_instagib_splash "0"


// --------------------
// MATCH RULES
// --------------------
set g_dm_holdable_adrenaline "0"
set g_dm_spawn_farthest "0"
set g_corpse_sink_time "15"
set g_dm_no_fall_damage "0"
set g_dm_no_self_damage "0"
set g_dm_respawn_delay_min "1"
set g_dm_respawn_point_min_dist "512"
set g_dm_respawn_point_min_dist_debug "0"
set g_dm_spawnpads "1"
set g_dm_player_spawn_rule "0"
set g_frag_messages "1"
set g_knockback_scale "1.0"
set g_mover_speed_scale "1"
set g_allow_techs "0"
set g_no_powerups "1"
set g_teleporter_freeze "0"
set g_dm_overtime "0"
set g_starting_health_bonus "0"
set g_arena_start_health "200"
set g_arena_start_armor "200"


// --------------------
// ITEM CONTROLS
// --------------------
set g_dm_powerup_drop "1"
set g_dm_powerups_style "0"          // 0=standard, 1=in-place respawn
set g_dm_random_items "0"
set g_dm_weapons_stay "0"
set g_weapon_respawn_time "60"        // literal seconds; weapons ignore the horde item scale
set g_horde_item_respawn_scale "4"    // non-weapon items: base * g_dm_item_respawn_rate * this
set g_horde_tech_reset_each_wave "1"  // 1=clear at countdown + fresh set each wave, 0=persist
set g_horde_tech_relocate "0"         // 0=techs stay put, 1=relocate to a new spot every 60s
set g_horde_tech_count "0"            // distinct techs per wave: 0=adaptive ceil(players/2), 1-4=fixed
set g_horde_tech_drop_on_death "1"    // 1=drop held tech on death, 0=keep it
set g_horde_tech_spawn_anywhere "1"   // 1=scatter on map floor, 0=spawn at deathmatch points
set g_horde_tech_duration "30"        // seconds a tech lasts after pickup (0=until dropped/lost)
set g_horde_tech_unique "0"           // 0=duplicates allowed (random), 1=distinct subset per wave
set g_instant_weapon_switch "0"


// --------------------
// TEAMPLAY
// --------------------
set g_teamplay_allow_team_pick "0"
set g_teamplay_force_balance "0"
set g_friendly_fire "0"


// --------------------
// HOOK
// --------------------
set g_allow_grapple "0"
set g_grapple_offhand "0"


// --------------------
// CLIENT/PLAYER LOAD MANAGEMENT
// --------------------
seta maxplayers "6"                  // effective slot limit for this mode
seta minplayers "1"


// --------------------
// ENTITY / ITEM OVERRIDES
// --------------------
set replace_item_power_screen "item_armor_combat"   // replace power screen pickups with combat armor
set disable_item_power_shield "1"                   // remove power shield pickups from maps (1=yes)


// --------------------
// MAP-SPECIFIC ITEM REPLACEMENTS
// --------------------


// --------------------
// START MAP
// --------------------
