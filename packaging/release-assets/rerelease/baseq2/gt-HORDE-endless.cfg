// --------------------
// HORDE ENDLESS CONFIG
// --------------------
// Identical to Horde, but waves never stop (roundlimit 0). Past the tuned content curve
// (g_horde_content_peak_wave, default 12) the late-wave systems engage: themes only roll when they
// can field on-category bodies, every spawn in a themed wave stays on-category, and the point budget
// tapers instead of growing linearly forever. These same systems also engage for a high *finite*
// roundlimit (e.g. 20/25), so this preset is just the unbounded case.

// Inherit the full Horde baseline, then override.
exec gt-HORDE.cfg


// --------------------
// SERVER IDENTITY
// --------------------
set hostname "Horde Endless"


// --------------------
// ENDLESS + LATE-WAVE TUNING
// --------------------
set roundlimit "0"                    // 0 = endless waves (no match-end cap)

set g_horde_content_peak_wave "12"    // wave where the tuned curve ends; late-wave logic fires above it
set g_horde_late_wave_factor "0.35"   // post-peak budget growth multiplier (lower = flatter late curve)
set g_horde_weight_floor "0.12"       // min monster weight past peak (keeps cheap chaff spendable)
set g_horde_theme_min_monsters "2"    // min on-theme bodies required for a theme banner to roll
set g_horde_points_max "0"            // optional hard budget ceiling (0 = off; taper handles growth)
