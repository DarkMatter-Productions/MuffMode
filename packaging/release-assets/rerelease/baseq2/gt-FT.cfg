// --------------------
// FREEZE TAG CONFIG
// --------------------
// Classic team Freeze Tag: deaths freeze players in place, teammates thaw by
// standing nearby, and freezing the whole opposing team wins the round.


// --------------------
// SERVER IDENTITY
// --------------------
set hostname "Freeze Tag"
set g_gametype_cfg "1"


// --------------------
// HARD RESET - full cvar baseline, stomps previous gametype
// --------------------

// Gametype
set g_gametype "6"                    // FT
set g_ruleset "4"                     // 1=Q2RE, 2=Muff Mode, 3=Q3A, 4=Q2RE Balanced, 6=QC

// Limits
set fraglimit "0"                     // team rounds decide the match
set timelimit "15"                    // backstop; checked between rounds
set capturelimit "0"
set roundlimit "8"                    // round wins needed to take the match
set roundtimelimit "3"                // per-round cap (mins); 0 = rounds only end on team freeze
set mercylimit "0"                    // disabled: freeze rounds should play out

// Match flow
set g_match_lock "0"
set g_dm_do_warmup "1"
set g_round_countdown "10"
set g_dm_do_readyup "0"
set g_warmup_ready_percentage "0"
set g_dm_so_readyup "0"

// Join / lobby / HUD behaviour
set g_dm_auto_join "0"
set g_dm_force_join "1"
set g_owner_auto_join "0"
set g_dm_crosshair_id "0"

// Bots
set bot_chat_enable "0"
set bot_skill "4"
set bot_minClients "3"               // fill with bots until N total clients connected
set g_dm_allow_no_humans "1"         // allow match to run with bots only


// --------------------
// MAP SELECTION
// --------------------
// Clear map system from previous gametype
set g_map_list ""
set g_map_list_shuffle "0"

// g_map_pool is available for vote but not auto-rotated
set g_map_list "q2dm1 q2dm2 q2dm3 q2dm5 q2dm6 q2dm7 q2dm8"
set g_map_pool "match1-re-b1 campgrounds mm-mcoil q2re-omf-b1 bloodrun kaktus-re-b1 mm-aerow mm-fleshref"
set g_map_list_shuffle "2"           // 0=sequential, 1=shuffle once, 2=random each map change


// --------------------
// GAME MODIFICATIONS
// --------------------
set g_frenzy "0"
set g_nadefest "0"
set g_vampiric_damage "0"
set g_quadhog "0"
set g_instagib "0"
set g_instagib_splash "0"


// --------------------
// MATCH RULES
// --------------------
set g_dm_holdable_adrenaline "0"
set g_dm_spawn_farthest "0"
set g_corpse_sink_time "15"
set g_dm_no_fall_damage "0"
set g_dm_no_self_damage "0"
set g_dm_respawn_delay_min "1"
set g_dm_respawn_point_min_dist "256"
set g_dm_respawn_point_min_dist_debug "0"
set g_dm_spawnpads "1"
set g_dm_player_spawn_rule "0"
set g_frag_messages "1"
set g_knockback_scale "1.0"
set g_freezetag_arena_loadout "0"   // set 1 to spawn/thaw with a full arena-style kit
set g_freezetag_thaw_time "3"        // seconds a teammate must hold nearby to thaw
set g_freezetag_multi_thaw_scale "0.5" // extra thaw speed per additional teammate
set g_freezetag_thaw_radius "96"     // thaw distance in units
set g_freezetag_auto_thaw_time "0"   // seconds before forced thaw; 0 disables
set g_freezetag_bot_rescue "1"       // bots try to rescue frozen teammates
set g_freezetag_frozen_knockback_scale "1.0"
set g_freezetag_thaw_respawn_at_location "0" // 0=respawn thawed players at spawn points, 1=restore at thaw spot
set g_freezetag_round_respawn_all "1" // 1=respawn all each round, 0=only frozen/dead/waiting players
set g_freezetag_round_reset_alive_inventory "1" // reset survivor inventory when respawning everyone
set g_mover_speed_scale "1"
set g_allow_techs "0"
set g_no_powerups "0"
set g_teleporter_freeze "0"
set g_dm_overtime "0"
set g_starting_health_bonus "0"
set g_arena_start_health "200"       // Freeze Tag arena-loadout health
set g_arena_start_armor "200"        // Freeze Tag arena-loadout armor


// --------------------
// ITEM CONTROLS
// --------------------
set g_dm_powerup_drop "1"
set g_dm_powerups_style "0"          // 0=standard, 1=in-place respawn
set g_dm_random_items "0"
set g_dm_weapons_stay "0"
set g_weapon_respawn_time "15"
set g_instant_weapon_switch "0"


// --------------------
// TEAMPLAY
// --------------------
set g_teamplay_allow_team_pick "0"
set g_teamplay_force_balance "0"
set g_friendly_fire "0"


// --------------------
// HOOK
// --------------------
set g_allow_grapple "1"
set g_grapple_offhand "0"


// --------------------
// CLIENT/PLAYER LOAD MANAGEMENT
// --------------------
seta maxplayers "10"                 // effective slot limit for this mode
seta minplayers "2"


// --------------------
// ENTITY / ITEM OVERRIDES
// --------------------
set replace_item_power_screen "item_armor_combat"   // replace power screen pickups with combat armor
set disable_item_power_shield "1"                   // remove power shield pickups from maps (1=yes)


// --------------------
// MAP-SPECIFIC ITEM REPLACEMENTS
// --------------------


// --------------------
// START MAP
// --------------------
