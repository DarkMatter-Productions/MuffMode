// ============================================================================
//  lobby-horde.cfg
// ----------------------------------------------------------------------------
//  A focused cooperative Horde lobby: six active-player slots from the Horde
//  factories plus two connected spectator slots. Load before creating it:
//
//      exec lobby-horde.cfg
//
//  Factory voting changes Horde difficulty/flavour without opening unrelated
//  gametypes. Map/MyMap requests stay closed so rotation eligibility is kept.
// ============================================================================

// If you copy this preset, point this exec at your copied baseline and update
// the pool/cycle filenames below to your operator-owned copies.
exec server-base.cfg

// ---- Connected capacity ---------------------------------------------------
set maxclients "8"
kexmultiplayer maxplayers "8"

// ---- Structured map catalog and rotation ---------------------------------
set g_maps_pool_file "muffmode-map-pool.json"
set g_maps_cycle_file "muffmode-map-cycle.txt"
set g_maps_random "1"
set g_maps_repeat_delay "1800"
set g_map_pick "0"

// ---- Match record and intermission policy --------------------------------
set g_ranked "0"
set g_match_awards "0"

// ---- Voting and player map choice -----------------------------------------
// 112697 protects Horde's mode/gameplay settings and disables readyall while
// retaining factory, nextmap, restart, and harmless utility votes.
set g_allow_voting "1"
set g_allow_vote_midgame "0"
set g_allow_spec_vote "0"
set g_allow_mymap "0"
set g_vote_limit "3"
set g_vote_flags "112697"
set g_votable_gametypes "horde"
set g_votable_factories "horde_classic horde_endless horde_hard vamphorde"
set g_votable_rulesets "q2reb"
set g_gametype_locked "0"

// ---- Matching startup selection ------------------------------------------
// Re-executing the complete preset live safely restores the shared baseline
// and re-applies this factory at a map boundary.
set g_gametype "10"
set g_factory "horde_classic"
