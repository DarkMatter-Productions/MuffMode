// ============================================================================
//  lobby-competitive.cfg
// ----------------------------------------------------------------------------
//  A ranked pickup, scrim, or event lobby with room for active players and
//  spectators. Load before creating the lobby:
//
//      exec lobby-competitive.cfg
//
//  Competition factories own gametype, ruleset, match limits, powerups,
//  friendly fire, and tech policy. Direct map and MyMap requests are disabled
//  so map tags and player-count bounds cannot be bypassed.
// ============================================================================

// If you copy this preset, point this exec at your copied baseline and update
// the pool/cycle filenames below to your operator-owned copies.
exec server-base.cfg

// ---- Connected capacity ---------------------------------------------------
// Shipped competition factories admit 2-10 active players. Six or more slots
// therefore remain available to spectators, depending on the selected mode.
set maxclients "16"
kexmultiplayer maxplayers "16"

// ---- Structured map catalog and rotation ---------------------------------
// Ordered selection makes an event's cycle predictable. Automatic transitions
// advance it. The post-match public next-map pick is intentionally disabled.
set g_maps_pool_file "muffmode-map-pool.json"
set g_maps_cycle_file "muffmode-map-cycle.txt"
set g_maps_random "0"
set g_maps_repeat_delay "1800"
set g_map_pick "0"

// ---- Match record and intermission policy --------------------------------
set g_ranked "1"
set g_match_awards "10"

// ---- Voting and player map choice -----------------------------------------
// 112697 disables map (1), gametype (8), time/score limits (16+32), ruleset
// (2048), powerups (4096), friendly fire (8192), readyall (32768), and techs
// (65536). Factory, nextmap, restart, shuffle, balance, and utility votes remain.
set g_allow_voting "1"
set g_allow_vote_midgame "0"
set g_allow_spec_vote "0"
set g_allow_mymap "0"
set g_vote_limit "3"
set g_vote_flags "112697"
set g_votable_gametypes "ffa duel tdm ctf ca ft strike"
set g_votable_factories "ffa_comp duel_comp tdm_comp ctf_comp ca_comp ft_comp strike_comp"
set g_votable_rulesets "q2re mm q2reb"
set g_gametype_locked "0"

// ---- Matching startup selection ------------------------------------------
// Duel starts at two active players. Factory votes can move to the approved
// team competition modes without exposing their non-competition variants.
// Re-executing the complete preset live safely re-applies this factory.
set g_gametype "2"
set g_factory "duel_comp"
