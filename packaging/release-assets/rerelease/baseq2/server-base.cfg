// ============================================================================
//  server-base.cfg
// ----------------------------------------------------------------------------
//  The shipped server baseline. Load this once at server start:
//
//      exec server-base.cfg
//
//  This packaged file may be replaced by an update. Copy it to an operator-owned
//  leaf filename before customizing it. MuffMode never writes either file at
//  runtime, and a factory can never change server identity, connected capacity,
//  voting policy, or admin policy.
//
//  How a MuffMode server is configured for play:
//
//      exec server-base.cfg     <- baseline: identity, capacity, policy
//      factory <id>             <- the gameplay preset: mode, limits, rotation
//
//  Run `factory list all` for the shipped presets and `factory info <id>` to see
//  exactly what one changes. Presets live in factories.cfg.
//
//  There are no functional, auto-executed gt-*.cfg presets any more. Factories
//  replaced them. A transition ZIP may carry inert compatibility markers. See
//  CONFIGS_README.md if you are migrating an older server config.
//
//  EDITING: never put a semicolon in a comment in this file. The console splits
//  the command buffer on that character before it strips the comment marker, so
//  the rest of the line is executed as a command. Quoting does not help. Use a
//  full stop instead. (factories.cfg is exempt -- it is parsed by the mod, not
//  the console.)
// ============================================================================


// ---- Server identity -------------------------------------------------------
// A factory cannot change this: a vote must not be able to rename your server.
// The mode still reaches players through the scoreboard and the HUD.
hostname "Welcome to Muff Mode!"


// ---- Client capacity -------------------------------------------------------
// maxclients allocates engine and game client slots. kexmultiplayer maxplayers
// requests the separate KEX lobby capacity. The game DLL cannot query the lobby
// provider, and a provider may still enforce a lower service-specific limit.
// Keep the two aligned.
set maxclients "128"
kexmultiplayer maxplayers "128"


// ---- Starting mode ---------------------------------------------------------
// Set BOTH, or neither. A factory belongs to one base gametype: naming a
// factory whose base does not match g_gametype is discarded at boot with a
// console notice. Leaving g_factory empty runs the plain gametype.
//
// Easier: leave these alone and run `factory <id>` once the server is up -- it
// sets the gametype for you.
set g_gametype "1"                    // 1=FFA 2=Duel 3=TDM 4=CTF 5=CA 6=FT
                                       // 7=Strike 8=RedRover 9=LMS 10=Horde 14=Arena
set g_factory ""                      // e.g. "instactf", "vampca", "horde_endless"

// Pin the shipped catalogue so an old/custom session value cannot make the
// lobby presets' factory ids disappear. Later files override earlier ones.
set g_factory_file "factories.cfg"
// To use operator-owned overrides instead:
// set g_factory_file "factories.cfg my-factories.cfg"


// ---- Fallback rotation and player limits -----------------------------------
// Most factories carry their own `maps` and `players`. These are what a factory
// that does not name them inherits, and what a factory switch restores to.
set minplayers "2"
set maxplayers "16"
set g_map_list "q2dm1 q2dm2 q2dm3 q2dm5 q2dm6 q2dm7 q2dm8"
set g_map_pool ""
set g_map_list_shuffle "2"            // 0=sequential 1=shuffle on wrap
                                       // 2=shuffle once per gametype
set g_dm_same_level "0"               // keep automatic rotation enabled


// ---- Ruleset ---------------------------------------------------------------
// A factory may select a ruleset by name. This is the fallback.
set g_ruleset "1"                     // 1=Q2RE 2=Muff Mode 3=Q3A 4=Q2RE Balanced
                                      // 5=Quake 6=Quake Champions


// ---- Voting and permissions ------------------------------------------------
// g_vote_flags is a DISABLE mask: add a bit to turn that vote off. Factory
// votes are bit 131072.
set g_allow_admin "1"
set g_allow_voting "1"
set g_allow_vote_midgame "0"          // relaxed presets opt in explicitly
set g_vote_flags "0"

// Empty means "everything the server supports". Narrow these on a public server.
set g_votable_gametypes "ffa tdm duel ca ft lms horde"
set g_votable_factories ""            // e.g. "ffa_classic instagib ctf_classic instactf"
set g_votable_rulesets "q2re mm q2reb"

// Add arena only after installing Arena-compatible maps and giving the
// arena_ra2 factory (or your own) a `maps` rotation of them. Tagged multi-room
// maps are the native path. g_arena_legacy_idmap stays fail-closed at 0.

// 1 pins the gametype and factory: admin commands and passed votes are both
// refused. The server console and rcon still get through, so you cannot lock
// yourself out. For a server that plays one mode and stays there.
set g_gametype_locked "0"


// ---- Shared gameplay baseline ----------------------------------------------
// Values that differ from the built-in defaults and that every shipped mode
// wants. A factory may still override any of them for its own mode.
set g_dm_crosshair_id "0"
set g_dm_holdable_adrenaline "0"
set g_dm_overtime "0"
set g_dm_spawn_farthest "0"           // superseded by the danger-score spawn rules
set g_owner_auto_join "0"
set g_mover_speed_scale "1"

// The mutators, explicitly off. Stating them establishes the value a mutator
// factory restores to when you switch away from it.
set g_instagib "0"
set g_instagib_splash "0"
set g_nadefest "0"
set g_quadhog "0"
set g_frenzy "0"
set g_vampiric_damage "0"


// ---- Safety and quality of life --------------------------------------------
set g_inactivity "120"
set g_dm_intermission_shots "0"
set g_owner_push_scores "1"
set g_showhelp "1"

set coop "0"
set deathmatch "1"


// ---- Entity overrides ------------------------------------------------------
set g_entity_override_dir "maps"
set g_entity_override_load "1"
set g_entity_override_save "0"


// ---- Diagnostics -----------------------------------------------------------
set g_muffmode_debug "0"              // verbose debug logging (0=off, 1=on)

// Run `doctor` after editing to check for risky cvar combinations.
