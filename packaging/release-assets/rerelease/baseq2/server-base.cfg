// ====================
// server-base.cfg
// Loaded in the lobby before any gametype config is executed.
// Provides safe defaults shared across all modes, individual gt-*.cfg
// files override these values as needed.
// ====================

// ---- Common safety / QoL ----
set g_inactivity "120"
set g_eyecam "1"
set g_dm_intermission_shots "0"
set g_owner_auto_join "0"
set g_owner_push_scores "1"
set g_showhelp "1"

// ---- Entity overrides ----
set g_entity_override_dir  "maps"
set g_entity_override_load "1"
set g_entity_override_save "0"

// ---- Core game mode baseline ----
set coop "0"
set deathmatch "1"
set g_ruleset "1"                     // 1=Q2RE, 2=Muff Mode, 3=Q3A, 4=Q2RE Balanced, 6=QC

// ---- Client / player load management (persist ok) ----
// Keep the requested KEX lobby capacity aligned with MuffMode's maxclients.
// The game DLL cannot query the active lobby provider; a provider may still
// enforce a lower service-specific limit.
set maxclients "128"
kexmultiplayer maxplayers "128"

// Votable gametypes — uncomment the full line to allow players to vote
// for all available modes, the active line restricts to tested/supported modes.
// Available: ffa duel tdm ctf ca ft strike rr lms horde instagib nadefest arena
// Available rulesets: q2re q2reb mm q3a q qc
// Add arena only after installing Arena-compatible maps and configuring an
// Arena g_map_list in gt-ARENA.cfg. Tagged multi-room maps are preferred; the
// shipped preset leaves legacy untagged-RA2 idmap compatibility disabled.
set g_votable_gametypes "ffa tdm duel ca ft lms horde instagib nadefest"
set g_votable_rulesets "q2re mm q2reb"
set g_allow_vote_midgame "1"

set g_muffmode_debug "0"              // Enable verbose debug logging (0=off, 1=on)
