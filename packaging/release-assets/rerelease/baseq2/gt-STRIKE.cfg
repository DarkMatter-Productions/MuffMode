// --------------------
// CAPTURE STRIKE CONFIG
// --------------------
// Round-based, single-life attack/defend CTF. Each turn one team attacks
// (capture the flag or wipe the defenders) while the other defends (wipe the
// attackers or run out the clock with the flag uncaptured). Roles swap every
// turn; first team to the roundlimit (after a complete round-pair) wins.


// --------------------
// SERVER IDENTITY
// --------------------
set hostname "Capture Strike"
set g_gametype_cfg "1"


// --------------------
// HARD RESET — full cvar baseline, stomps previous gametype
// --------------------

// Gametype
set g_gametype "7"                    // CaptureStrike
set g_ruleset "1"                     // 1=Q2RE, 2=Muff Mode, 3=Q3A, 4=Q2RE Balanced, 6=QC

// Limits
set fraglimit "0"
set timelimit "0"
set capturelimit "8"
set roundlimit "8"                    // turn-wins needed to take the match
set roundtimelimit "2"                // minutes per turn; defenders win if it expires

// Match flow
set g_match_lock "1"                  // prevent mid-match joins, players wait for next match
set g_dm_do_warmup "1"
set g_round_countdown "10"
set g_dm_do_readyup "1"
set g_warmup_ready_percentage "1.0"   // fraction of players that must ready up (1.0 = all)
set g_dm_so_readyup "0"

// Join / lobby / HUD behaviour
set g_dm_auto_join "0"
set g_dm_force_join "0"
set g_owner_auto_join "0"
set g_dm_crosshair_id "0"

// Bots
set bot_chat_enable "0"
set bot_skill "4"
set bot_minClients "0"
set g_dm_allow_no_humans "0"


// --------------------
// MAP SELECTION
// --------------------
// Clear map system from previous gametype
set g_map_list ""
set g_map_list_shuffle "0"

// CaptureStrike requires CTF maps (two bases / flags)
set g_map_list "lfctf4 lfctf4z lfctf10 lfctf10z nxctf7 marics_ctf18 stdctf4a nxctf4b marics_ctf21 as2m7 q2ctf1"
set g_map_pool ""
set g_map_list_shuffle "2"           // 0=sequential, 1=shuffle once, 2=random each map change


// --------------------
// GAME MODIFICATIONS
// --------------------
set g_frenzy "0"
set g_nadefest "0"
set g_vampiric_damage "0"
set g_quadhog "0"
set g_instagib "0"
set g_instagib_splash "0"


// --------------------
// MATCH RULES
// --------------------
set g_dm_holdable_adrenaline "0"
set g_dm_spawn_farthest "0"
set g_corpse_sink_time "15"
set g_dm_no_fall_damage "0"
set g_dm_no_self_damage "0"
set g_dm_respawn_delay_min "1"
set g_dm_respawn_point_min_dist "256"
set g_dm_respawn_point_min_dist_debug "0"
set g_dm_spawnpads "1"
set g_dm_player_spawn_rule "0"
set g_frag_messages "1"
set g_knockback_scale "1.0"
set g_mover_speed_scale "1"
set g_allow_techs "0"
set g_no_powerups "0"
set g_teleporter_freeze "0"
set g_dm_overtime "0"
set g_starting_health_bonus "0"
set g_arena_start_health "150"       // single life per turn: spawn health
set g_arena_start_armor "150"        // single life per turn: spawn armor


// --------------------
// ITEM CONTROLS
// --------------------
set g_dm_powerup_drop "1"
set g_dm_powerups_style "0"          // 0=standard, 1=in-place respawn
set g_dm_random_items "0"
set g_dm_weapons_stay "1"
set g_weapon_respawn_time "0"
set g_instant_weapon_switch "1"


// --------------------
// TEAMPLAY
// --------------------
set g_teamplay_allow_team_pick "1"
set g_teamplay_force_balance "0"
set g_friendly_fire "0"


// --------------------
// HOOK
// --------------------
set g_allow_grapple "1"
set g_grapple_offhand "0"


// --------------------
// CLIENT/PLAYER LOAD MANAGEMENT
// --------------------
seta maxplayers "10"                 // effective slot limit for this mode
seta minplayers "2"


// --------------------
// ENTITY / ITEM OVERRIDES
// --------------------
set replace_item_power_screen "item_armor_combat"   // replace power screen pickups with combat armor
set disable_item_power_shield "1"                   // remove power shield pickups from maps (1=yes)


// --------------------
// MAP-SPECIFIC ITEM REPLACEMENTS
// --------------------


// --------------------
// START MAP
// --------------------
