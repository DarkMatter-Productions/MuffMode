// ============================================================================
//  lobby-casual.cfg
// ----------------------------------------------------------------------------
//  A flexible 16-slot public or friends lobby. Load this before creating the
//  lobby so maxclients and the KEX lobby request take effect together:
//
//      exec lobby-casual.cfg
//
//  Factories remain the atomic way to change gametype and ruleset. Direct map
//  choices stay available for a relaxed lobby, while the normal rotation and
//  next-map pick still use the structured pool's mode and player-count policy.
// ============================================================================

// If you copy this preset, point this exec at your copied baseline and update
// the pool/cycle filenames below to your operator-owned copies.
exec server-base.cfg

// ---- Connected capacity ---------------------------------------------------
// House Deathmatch admits up to 12 active players. The remaining slots can
// spectate. The active-player limit follows whichever factory is selected.
set maxclients "16"
kexmultiplayer maxplayers "16"

// ---- Structured map catalog and rotation ---------------------------------
set g_maps_pool_file "muffmode-map-pool.json"
set g_maps_cycle_file "muffmode-map-cycle.txt"
set g_maps_random "1"
set g_maps_repeat_delay "1800"
set g_map_pick "15"

// ---- Match record and intermission policy --------------------------------
set g_ranked "0"
set g_match_awards "0"

// ---- Voting and player map choice -----------------------------------------
// 2056 disables direct gametype (8) and ruleset (2048) votes. Factory votes
// remain enabled and set their matching gametype and ruleset together.
set g_allow_voting "1"
set g_allow_vote_midgame "1"
set g_allow_spec_vote "0"
set g_allow_mymap "1"
set g_vote_limit "3"
set g_vote_flags "2056"
set g_votable_gametypes "ffa duel tdm ctf ca ft strike rr lms horde"
set g_votable_factories "ffa_classic house_dm duel_classic duel_mm tdm_classic ctf_classic ctf_ironman ca_classic ft_classic strike_classic rr_classic lms_classic horde_classic horde_endless horde_hard"
set g_votable_rulesets "q2re mm q2reb"
set g_gametype_locked "0"

// ---- Matching startup selection ------------------------------------------
// Keep this pair together. They apply at boot, and re-executing the complete
// preset live re-applies the factory at a safe map boundary.
set g_gametype "1"
set g_factory "house_dm"
