name: Validate Release Workflow
run-name: Validate Release Workflow

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to validate.
        required: true
        type: choice
        default: beta
        options:
          - alpha
          - beta
          - rc
          - stable

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: windows-2025-vs2026
    timeout-minutes: 10

    steps:
      - name: Validate Workflow Metadata
        shell: pwsh
        run: |
          Write-Host "Validation workflow only. It will not build, publish, or announce a release."

  version:
    name: Resolve Version
    needs: preflight
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate Release Workflow Contract
        shell: pwsh
        run: ./scripts/ci/check-release-workflow.ps1

      - name: Validate Version Resolution
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VALIDATE_CHANNEL: ${{ inputs.channel }}
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          .\scripts\release.ps1 `
            -Version $version `
            -Channel $env:RELEASE_VALIDATE_CHANNEL `
            -VersionOnly `
            -AllowDirtyPackage
