name: Build Windows DLL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muffmode-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check generated artifacts
        shell: pwsh
        run: ./scripts/ci/check-generated-artifacts.ps1

      - name: Check map-pool examples
        shell: pwsh
        run: ./scripts/ci/check-map-pool-examples.ps1

      - name: Check changelog ledger
        shell: pwsh
        run: ./scripts/ci/check-changelog.ps1

      - name: Check phase-zero asset seeds
        shell: pwsh
        run: ./scripts/ci/check-test-assets.ps1 -RepoOnly

      - name: Check regression corpus
        shell: pwsh
        run: ./scripts/ci/check-regression-corpus.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Run host smoke tests
        shell: pwsh
        run: ./scripts/ci/run-host-tests.ps1 -Configuration Release -Platform x64

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        shell: pwsh
        run: ./scripts/ci/setup-vcpkg.ps1 -Install
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Check dependency inventory
        shell: pwsh
        run: ./scripts/ci/check-dependency-inventory.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/ci/build-msbuild.ps1 -Configuration Release -Platform x64 -TreatWarningsAsErrors -BinaryLog
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Upload MSBuild log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-msbuild-log
          path: build/logs/*.binlog

      - name: Upload game_x64.dll
        uses: actions/upload-artifact@v7
        with:
          name: game_x64
          path: build/msbuild/x64/Release/game_x64.dll
